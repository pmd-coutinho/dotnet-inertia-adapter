name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            dotnet-version: 8.0.x
          - framework: net9.0
            dotnet-version: 9.0.x
          - framework: net10.0
            dotnet-version: 10.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore tests
        run: dotnet restore tests/InertiaNet.Tests/InertiaNet.Tests.csproj -p:TargetFramework=${{ matrix.framework }}

      - name: Test
        run: dotnet test tests/InertiaNet.Tests/InertiaNet.Tests.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore

  test-pathfinder:
    name: Test Pathfinder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Pathfinder tests
        run: |
          dotnet restore src/InertiaNet.Pathfinder/InertiaNet.Pathfinder.csproj
          dotnet restore tests/InertiaNet.Pathfinder.Tests/InertiaNet.Pathfinder.Tests.csproj

      - name: Test Pathfinder
        run: dotnet test tests/InertiaNet.Pathfinder.Tests/InertiaNet.Pathfinder.Tests.csproj --configuration Release --no-restore

  test-pathfinder-packages:
    name: Installed Pathfinder and build integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack tool and build companion
        run: |
          dotnet pack src/InertiaNet.Pathfinder/InertiaNet.Pathfinder.csproj -c Release -o artifacts
          dotnet pack src/InertiaNet.Pathfinder.Build/InertiaNet.Pathfinder.Build.csproj -c Release -o artifacts
      - name: Install and exercise all supported frameworks
        run: |
          version=$(dotnet msbuild src/InertiaNet.Pathfinder/InertiaNet.Pathfinder.csproj -getProperty:Version)
          node scripts/test-pathfinder-package.cjs artifacts "$version" net8.0 net9.0 net10.0

  test-generated-typescript:
    name: Generated TypeScript (Inertia ${{ matrix.inertia }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        inertia: ['3.0.2', '3.9.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/InertiaNet.Pathfinder.TypeScript/package-lock.json
      - name: Install compiler and client
        working-directory: tests/InertiaNet.Pathfinder.TypeScript
        run: npm ci && npm install --no-save --package-lock=false @inertiajs/core@${{ matrix.inertia }}
      - name: Generate, type-check, and execute route contracts
        working-directory: tests/InertiaNet.Pathfinder.TypeScript
        run: npm test

  test-playground:
    name: React and Vue browser integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/Playground/ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: samples/Playground/ClientApp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:manifest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playground-browser-failure
          path: samples/Playground/ClientApp/test-results

  test-kitchen-sink:
    name: Kitchen sink browser integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/KitchenSink/ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: samples/KitchenSink/ClientApp/package-lock.json
      - run: dotnet build ../KitchenSink.AppHost/KitchenSink.AppHost.csproj
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kitchen-sink-browser-failure
          path: samples/KitchenSink/ClientApp/test-results

  test-analyzers:
    name: Test Analyzers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore analyzer tests
        run: dotnet restore tests/InertiaNet.Analyzers.Tests/InertiaNet.Analyzers.Tests.csproj

      - name: Test Analyzers
        run: dotnet test tests/InertiaNet.Analyzers.Tests/InertiaNet.Analyzers.Tests.csproj --configuration Release --no-restore

  test-templates:
    name: Test Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read Shared Package Versions
        id: versions
        run: |
          echo "platform_version=$(dotnet msbuild src/InertiaNet/InertiaNet.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Pack InertiaNet
        run: dotnet pack src/InertiaNet/InertiaNet.csproj --configuration Release -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Stage Templates Package Sources
        run: bash scripts/stage-templates.sh src/InertiaNet.Templates "$RUNNER_TEMP/InertiaNet.Templates" "${{ steps.versions.outputs.platform_version }}"

      - name: Pack Templates
        run: dotnet pack "$RUNNER_TEMP/InertiaNet.Templates/InertiaNet.Templates.csproj" --configuration Release -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Install Templates
        shell: bash
        run: |
          shopt -s nullglob nocaseglob
          packages=(artifacts/InertiaNet.Templates.*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one templates package, found ${#packages[@]}" >&2
            ls -la artifacts >&2
            exit 1
          fi
          dotnet new install "${packages[0]}"

      - name: Generate React Starter
        run: dotnet new inertianet-react -n SmokeReact -o artifacts/smoke-react

      - name: Generate Vue Starter
        run: dotnet new inertianet-vue -n SmokeVue -o artifacts/smoke-vue

      - name: Verify ClientApp Workspace Layout
        run: test -f artifacts/smoke-react/ClientApp/package.json && test -f artifacts/smoke-react/ClientApp/vite.config.ts && test -f artifacts/smoke-react/.devcontainer/devcontainer.json && test -f artifacts/smoke-react/wwwroot/.gitkeep && test -f artifacts/smoke-vue/ClientApp/package.json && test -f artifacts/smoke-vue/ClientApp/vite.config.ts && test -f artifacts/smoke-vue/.devcontainer/devcontainer.json && test -f artifacts/smoke-vue/wwwroot/.gitkeep

      - name: Install React Starter Frontend Dependencies
        run: cd artifacts/smoke-react/ClientApp && npm install

      - name: Install Vue Starter Frontend Dependencies
        run: cd artifacts/smoke-vue/ClientApp && npm install

      - name: Type-check And Build React Starter Frontend
        run: cd artifacts/smoke-react/ClientApp && npm run build

      - name: Type-check And Build Vue Starter Frontend
        run: cd artifacts/smoke-vue/ClientApp && npm run build

      - name: Restore And Build React Starter
        run: dotnet restore artifacts/smoke-react/SmokeReact.csproj --source artifacts --source https://api.nuget.org/v3/index.json && dotnet build artifacts/smoke-react/SmokeReact.csproj --no-restore

      - name: Restore And Build Vue Starter
        run: dotnet restore artifacts/smoke-vue/SmokeVue.csproj --source artifacts --source https://api.nuget.org/v3/index.json && dotnet build artifacts/smoke-vue/SmokeVue.csproj --no-restore

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - test
      - test-pathfinder
      - test-pathfinder-packages
      - test-generated-typescript
      - test-playground
      - test-analyzers
      - test-templates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read Shared Package Versions
        id: versions
        run: |
          echo "platform_version=$(dotnet msbuild src/InertiaNet/InertiaNet.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Restore package
        run: dotnet restore InertiaNet.slnx

      - name: Pack InertiaNet
        run: dotnet pack src/InertiaNet/InertiaNet.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Pack Pathfinder Tool
        run: dotnet pack src/InertiaNet.Pathfinder/InertiaNet.Pathfinder.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Pack Pathfinder Build
        run: dotnet pack src/InertiaNet.Pathfinder.Build/InertiaNet.Pathfinder.Build.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Pack Analyzers
        run: dotnet pack src/InertiaNet.Analyzers/InertiaNet.Analyzers.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Stage Templates Package Sources
        run: bash scripts/stage-templates.sh src/InertiaNet.Templates "$RUNNER_TEMP/InertiaNet.Templates" "${{ steps.versions.outputs.platform_version }}"

      - name: Pack Templates
        run: dotnet pack "$RUNNER_TEMP/InertiaNet.Templates/InertiaNet.Templates.csproj" --configuration Release -p:ContinuousIntegrationBuild=true -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: inertia-packages
          path: artifacts/*
